name: Build LiveContainerTV IPA
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OpenSSL.xcframework (includes tvOS)
        run: |
          set -ex
          git clone --depth 1 https://github.com/krzyzanowskim/OpenSSL.git OpenSSL
          ls OpenSSL/Frameworks/OpenSSL.xcframework
          test -d OpenSSL/Frameworks/OpenSSL.xcframework/tvos-arm64

      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate && xcodebuild -version

      - name: Build
        run: |
          set -exo pipefail
          for t in LiveContainerTV GuestDemo; do
            xcodebuild build -project LiveContainerTV.xcodeproj -target "$t" -sdk appletvos -configuration Release \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" SYMROOT=$PWD/build 2>&1 | tee "build-$t.log" | grep -E "error:|warning: .*LCTV|BUILD (SUCCEEDED|FAILED)" || true
            grep -q "BUILD SUCCEEDED" "build-$t.log" || { grep -B2 -A5 "error:" "build-$t.log" | head -80; exit 1; }
          done
          test -f build/Release-appletvos/LiveContainerTV.app/Info.plist
          test -d build/Release-appletvos/GuestDemo.app

      - name: Package
        run: |
          set -ex
          APP=build/Release-appletvos/LiveContainerTV.app
          G=build/Release-appletvos/GuestDemo.app
          FW=$APP/Frameworks/GuestDemo.framework
          mkdir -p "$FW"
          cp -R "$G"/* "$FW"/
          rm -rf "$FW/_CodeSignature"
          plutil -replace CFBundlePackageType -string FMWK "$FW/Info.plist"
          plutil -replace LCTVGuest -bool YES "$FW/Info.plist"
          # Also embed OpenSSL.framework if xcode didn't
          if [ ! -d "$APP/Frameworks/OpenSSL.framework" ] && [ -d OpenSSL/Frameworks/OpenSSL.xcframework/tvos-arm64/OpenSSL.framework ]; then
            mkdir -p "$APP/Frameworks"
            cp -R OpenSSL/Frameworks/OpenSSL.xcframework/tvos-arm64/OpenSSL.framework "$APP/Frameworks/"
          fi
          lipo -info "$FW/GuestDemo" || true
          python3 tools/patch_macho.py "$FW/GuestDemo"
          otool -hv "$FW/GuestDemo" | head -5
          mkdir -p out/Payload
          rm -rf out/Payload/*
          cp -R "$APP" out/Payload/
          (cd out && zip -qry LiveContainerTV.ipa Payload)
          ls -lh out/LiveContainerTV.ipa

      - name: Verify IPA contents
        run: |
          set -eo pipefail
          L=$(unzip -l out/LiveContainerTV.ipa)
          for f in Payload/LiveContainerTV.app/Info.plist Payload/LiveContainerTV.app/LiveContainerTV Payload/LiveContainerTV.app/Assets.car Payload/LiveContainerTV.app/Frameworks/GuestDemo.framework/GuestDemo Payload/LiveContainerTV.app/Frameworks/GuestDemo.framework/Info.plist; do
            echo "$L" | grep -q " $f\$" || { echo "MISSING $f"; exit 1; }
            echo "OK $f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainerTV-ipa
          path: out/LiveContainerTV.ipa
