name: Build LiveContainerTV IPA
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OpenSSL.xcframework (includes tvOS)
        run: |
          set -ex
          git clone --depth 1 https://github.com/krzyzanowskim/OpenSSL.git OpenSSL
          ls OpenSSL/Frameworks/OpenSSL.xcframework
          test -d OpenSSL/Frameworks/OpenSSL.xcframework/tvos-arm64

      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate && xcodebuild -version

      - name: Build
        run: |
          set -exo pipefail
          for t in LiveContainerTV; do
            xcodebuild build -project LiveContainerTV.xcodeproj -target "$t" -sdk appletvos -configuration Release \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" SYMROOT=$PWD/build 2>&1 | tee "build-$t.log" | grep -E "error:|warning: .*LCTV|BUILD (SUCCEEDED|FAILED)" || true
            grep -q "BUILD SUCCEEDED" "build-$t.log" || { grep -B2 -A5 "error:" "build-$t.log" | head -80; exit 1; }
          done
          test -f build/Release-appletvos/LiveContainerTV.app/Info.plist

      - name: Package
        run: |
          set -ex
          APP=build/Release-appletvos/LiveContainerTV.app
          # Also embed OpenSSL.framework if xcode didn't
          if [ ! -d "$APP/Frameworks/OpenSSL.framework" ] && [ -d OpenSSL/Frameworks/OpenSSL.xcframework/tvos-arm64/OpenSSL.framework ]; then
            mkdir -p "$APP/Frameworks"
            cp -R OpenSSL/Frameworks/OpenSSL.xcframework/tvos-arm64/OpenSSL.framework "$APP/Frameworks/"
          fi
          mkdir -p out/Payload
          rm -rf out/Payload/*
          cp -R "$APP" out/Payload/
          (cd out && zip -qry LiveContainerTV.ipa Payload)
          ls -lh out/LiveContainerTV.ipa

      - name: Verify IPA contents
        run: |
          set -eo pipefail
          L=$(unzip -l out/LiveContainerTV.ipa)
          for f in Payload/LiveContainerTV.app/Info.plist Payload/LiveContainerTV.app/LiveContainerTV Payload/LiveContainerTV.app/Assets.car Payload/LiveContainerTV.app/lctv_logo.png Payload/LiveContainerTV.app/Frameworks/OpenSSL.framework/OpenSSL; do
            echo "$L" | grep -q " $f\$" || { echo "MISSING $f"; exit 1; }
            echo "OK $f"
          done
          if echo "$L" | grep -qi guestdemo; then echo "GuestDemo must not be in IPA"; exit 1; fi; echo "OK no GuestDemo"

      - name: Verify logo + layers
        run: |
          set -e
          unzip -l out/LiveContainerTV.ipa | grep -q "LiveContainerTV.app/lctv_logo.png" && echo "OK logo"
          xcrun --sdk appletvos assetutil --info build/Release-appletvos/LiveContainerTV.app/Assets.car | grep -E '"Name"|Layer' | sort | uniq -c | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainerTV-ipa
          path: out/LiveContainerTV.ipa

      - name: Simulator screenshot
        continue-on-error: true
        run: |
          set -x
          ls OpenSSL/Frameworks/OpenSSL.xcframework
          xcodebuild build -project LiveContainerTV.xcodeproj -target LiveContainerTV -sdk appletvsimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO SYMROOT=$PWD/simbuild 2>&1 | tail -30
          APP=$(ls -d simbuild/Debug-appletvsimulator/LiveContainerTV.app)
          DEV=$(xcrun simctl list devices available | grep -m1 "Apple TV" | grep -oE '[0-9A-F-]{36}')
          [ -n "$DEV" ] || DEV=$(xcrun simctl create shot "Apple TV 4K (3rd generation)")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.hongson117.livecontainertv -LCTVScreenshotDemo YES
          sleep 12
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/home.png
          xcrun simctl terminate "$DEV" com.hongson117.livecontainertv || true
          xcrun simctl launch --console-pty "$DEV" com.hongson117.livecontainertv -LCTVScreenshotDemo YES -LCTVFocusTest YES > shots/focus.log 2>&1 &
          sleep 10
          xcrun simctl io "$DEV" screenshot shots/focus_diag.png
          grep FOCUSTEST shots/focus.log || true
          xcrun simctl terminate "$DEV" com.hongson117.livecontainertv || true
          xcrun simctl launch "$DEV" com.hongson117.livecontainertv -LCTVShowGuide YES
          sleep 8
          xcrun simctl io "$DEV" screenshot shots/guide.png
          ls -l shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
